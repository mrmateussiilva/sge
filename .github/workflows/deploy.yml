name: Deploy para VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "==> Executando backup antes do deploy..."
            if [ -x /usr/local/sbin/sge-backup ]; then
              sudo -n /usr/local/sbin/sge-backup
            else
              echo "==> ERRO: backup não está instalado na VPS."
              echo "==> Execute: sudo bash scripts/install_sge_backup.sh \"$PWD\""
              exit 1
            fi

            echo "==> Atualizando código..."
            git pull origin main

            echo "==> Atualizando rotina de backup instalada..."
            sudo -n bash scripts/install_sge_backup.sh "$PWD"

            echo "==> Rebuilding e subindo container..."
            docker compose up -d --build

            echo "==> Verificando saúde da aplicação..."
            for tentativa in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health/; then
                echo
                echo "==> Health check OK!"
                break
              fi
              if [ "$tentativa" -eq 30 ]; then
                echo "==> Health check falhou após 60 segundos."
                docker compose logs --tail=100 sge || true
                exit 1
              fi
              sleep 2
            done

            echo "==> Limpando imagens antigas..."
            docker image prune -f

            echo "==> Deploy concluído!"
