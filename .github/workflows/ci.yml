name: CI (Testes & Linter)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django & Linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configurar Python
        run: uv python install 3.13

      - name: Sincronizar dependências
        run: uv sync --frozen

      - name: Rodar testes Django
        run: uv run python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-secret-key-test
          DJANGO_DEBUG: "True"

  frontend:
    name: Frontend (TypeScript, Build & Oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Rodar Oxlint
        run: npm run lint
        working-directory: frontend

      - name: Validar Build e Tipos TypeScript
        run: npm run build
        working-directory: frontend
