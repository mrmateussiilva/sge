{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ["class"],
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        card: "hsl(var(--card))",
                        "card-foreground": "hsl(var(--card-foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        }
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            /* Shadcn UI colors identical to frontend/src/index.css */
            --background: 210 40% 98%;
            --foreground: 222 47% 11%;
            --card: 0 0% 100%;
            --card-foreground: 222 47% 11%;
            --primary: 221 83% 53%;
            --primary-foreground: 210 40% 98%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 221 83% 53%;
            --radius: 0.5rem;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: 224 71% 4%;
                --foreground: 213 31% 91%;
                --card: 224 71% 7%;
                --card-foreground: 213 31% 91%;
                --primary: 217 91% 60%;
                --primary-foreground: 222 47% 11%;
                --muted: 215 28% 17%;
                --muted-foreground: 217.9 10.6% 64.9%;
                --border: 215 28% 18%;
                --input: 215 28% 18%;
                --ring: 217 91% 60%;
            }
        }
        
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        /* Beautiful modern background pattern */
        .bg-grid-pattern {
            background-image: 
                radial-gradient(at 0% 0%, hsla(var(--primary) / 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(var(--primary) / 0.1) 0px, transparent 50%);
        }
        
        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-size: 30px 30px;
            background-image: linear-gradient(to right, hsla(var(--foreground) / 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, hsla(var(--foreground) / 0.03) 1px, transparent 1px);
            z-index: 0;
            pointer-events: none;
        }
        
        @media (prefers-color-scheme: dark) {
            .grid-overlay {
                background-image: linear-gradient(to right, hsla(var(--foreground) / 0.05) 1px, transparent 1px),
                                  linear-gradient(to bottom, hsla(var(--foreground) / 0.05) 1px, transparent 1px);
            }
            .bg-grid-pattern {
                background-image: 
                    radial-gradient(at 0% 0%, hsla(var(--primary) / 0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 0%, hsla(var(--primary) / 0.1) 0px, transparent 50%);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center font-[Inter] bg-grid-pattern relative overflow-hidden p-4">
    
    <div class="grid-overlay"></div>

    <div class="w-full max-w-[400px] z-10">
        <!-- Logo / Branding Center -->
        <div class="flex flex-col items-center justify-center mb-8 text-center">
            <div class="w-12 h-12 bg-primary text-primary-foreground rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
                <i data-lucide="package-search" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">SGE Estoque</h1>
            <p class="text-sm text-muted-foreground mt-1">Gestão de Inventário e Materiais</p>
        </div>

        <!-- Card Container -->
        <div class="bg-card text-card-foreground border border-border shadow-sm rounded-xl overflow-hidden">
            <div class="p-6 sm:p-8">
                <div class="flex flex-col space-y-1 mb-6 text-center">
                    <h2 class="text-xl font-semibold tracking-tight">Acesso Restrito</h2>
                    <p class="text-sm text-muted-foreground">Insira suas credenciais corporativas</p>
                </div>

                {% if form.errors %}
                <div class="bg-destructive/10 text-destructive text-sm p-3 rounded-md flex items-center gap-2 mb-6 border border-destructive/20">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                    <span>Usuário ou senha incorretos.</span>
                </div>
                {% endif %}

                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    
                    <!-- Username Input -->
                    <div class="space-y-2">
                        <label for="id_username" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Usuário</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-muted-foreground">
                                <i data-lucide="user" class="w-4 h-4"></i>
                            </div>
                            <input type="text" name="username" id="id_username" required
                                class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 pl-9 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-colors"
                                placeholder="Seu nome de usuário">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <label for="id_password" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Senha</label>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-muted-foreground">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                            </div>
                            <input type="password" name="password" id="id_password" required
                                class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 pl-9 pr-10 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-colors"
                                placeholder="••••••••">
                            <button type="button" class="toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-muted-foreground hover:text-foreground transition-colors" aria-label="Mostrar/Esconder Senha">
                                <i data-lucide="eye" class="w-4 h-4 eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 mt-6 font-semibold shadow-sm">
                        Entrar no Sistema
                        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                    </button>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
            
            <div class="bg-muted/40 p-4 border-t border-border text-center">
                <p class="text-xs text-muted-foreground flex items-center justify-center gap-1.5">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                    Acesso monitorado e auditado.
                </p>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
        
        const togglePassword = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#id_password');
        
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const newIcon = type === 'password' ? 'eye' : 'eye-off';
                togglePassword.innerHTML = `<i data-lucide="${newIcon}" class="w-4 h-4 eye-icon"></i>`;
                lucide.createIcons();
            });
        }
    </script>
</body>
</html>
