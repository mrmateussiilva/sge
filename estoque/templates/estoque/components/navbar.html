<nav class="navbar app-navbar border-bottom px-3 py-2 position-relative"
     hx-boost="true"
     hx-target="#main-content"
     hx-select="#main-content"
     hx-swap="innerHTML">
    <div class="d-flex align-items-center justify-content-between w-100">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light border-0 py-1 px-2" id="menu-toggle" aria-label="Menu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <span class="fw-bold d-lg-none ms-1 text-primary fs-5">
                <i class="bi bi-box-seam me-1"></i> S.G.E
            </span>
        </div>
        
        <!-- Busca Global -->
        <div class="global-search d-none d-md-flex mx-3 position-relative flex-grow-1">
            <div class="input-group">
                <span class="input-group-text border-end-0 text-muted"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control border-start-0" id="global-search-input" placeholder="Buscar produto... (Ctrl+K)" autocomplete="off">
                <span class="search-shortcut input-group-text text-muted small border-start-0 d-none d-lg-flex">Ctrl+K</span>
            </div>
            <div id="global-search-results" class="search-results position-absolute w-100 mt-1 border rounded shadow d-none">
                <!-- Resultados via JS -->
            </div>
        </div>
        
        <div class="d-flex align-items-center gap-2">
            <button id="mobileSearchToggle" class="btn btn-sm btn-outline-secondary d-md-none border-0 rounded-circle py-1 px-2" type="button" title="Buscar produto" aria-label="Buscar produto">
                <i class="bi bi-search"></i>
            </button>
            {% if user.is_authenticated and estoque_baixo_count > 0 %}
            <a href="{% url 'lista_produtos' %}?filtro=baixo" class="btn btn-sm btn-outline-danger d-lg-none position-relative py-1 px-2" title="Estoque baixo" aria-label="Produtos com estoque baixo">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span class="notification-count position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    {{ estoque_baixo_count }}
                </span>
            </a>
            {% endif %}
            <button id="darkModeToggleHeader" class="btn btn-sm btn-outline-secondary d-lg-none border-0 rounded-circle py-1 px-2" title="Alternar tema" aria-label="Alternar tema">
                <i class="bi bi-moon-stars"></i>
            </button>
        </div>
    </div>
</nav>
