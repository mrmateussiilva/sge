<!-- Bottom Navigation (Mobile) -->
<nav class="bottom-nav d-md-none border-top shadow-sm w-100 d-flex justify-content-around align-items-center pb-2 pt-2 position-fixed bottom-0 z-3"
     id="mobile-bottom-nav"
     hx-boost="true"
     hx-target="#main-content"
     hx-select="#main-content"
     hx-swap="innerHTML">
    <a href="/" class="nav-link text-center d-flex flex-column align-items-center px-2 py-1 text-secondary {% if request.path == '/' %}text-primary fw-bold{% endif %}">
        <i class="bi bi-grid-1x2-fill fs-5 mb-1"></i><span class="bottom-nav__label">Início</span>
    </a>
    <a href="/produtos/" class="nav-link text-center d-flex flex-column align-items-center px-2 py-1 text-secondary {% if '/produtos/' in request.path %}text-primary fw-bold{% endif %}">
        <i class="bi bi-box-seam fs-5 mb-1"></i><span class="bottom-nav__label">Produtos</span>
    </a>
    <!-- FAB de Movimentação Centralizado na Bottom Nav -->
    <button type="button" class="bottom-nav__action btn btn-primary rounded-circle shadow d-flex align-items-center justify-content-center" onclick="openGlobalMoveModal()" title="Registrar movimentação" aria-label="Registrar movimentação rápida">
        <i class="bi bi-plus-lg fs-3"></i>
    </button>
    <a href="/ordens/" class="nav-link text-center d-flex flex-column align-items-center px-2 py-1 text-secondary {% if '/ordens/' in request.path %}text-primary fw-bold{% endif %}">
        <i class="bi bi-cart fs-5 mb-1"></i><span class="bottom-nav__label">Ordens</span>
    </a>
    <a href="#" class="nav-link text-center d-flex flex-column align-items-center px-2 py-1 text-secondary" hx-boost="false" onclick="toggleSidebar(); return false;">
        <i class="bi bi-three-dots fs-5 mb-1"></i><span class="bottom-nav__label">Mais</span>
    </a>
</nav>
