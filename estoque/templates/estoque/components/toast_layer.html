<div id="loading-overlay">
    <div class="text-center">
        <div class="loading-spinner spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="mt-2 text-muted fw-medium small">Carregando...</p>
    </div>
</div>

<div class="toast-layer toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
</div>
