{% extends 'estoque/base.html' %}
{% block title %}S.G.E - Categorias{% endblock %}

{% block content %}
<div class="page-container">
    <header class="page-header">
        <div class="page-header__content">
            <div class="page-header__title">
                <span class="page-header__icon"><i class="bi bi-tags"></i></span>
                <h1>Categorias</h1>
            </div>
            <p class="page-header__description">Organize os produtos em grupos de consulta e acompanhamento.</p>
        </div>
        <div class="page-header__actions">
            <button
                type="button"
                class="btn btn-primary"
                hx-get="{% url 'criar_categoria' %}"
                hx-include="#categoria-busca"
                hx-target="#modal-categoria-container"
                hx-disinherit="hx-select"
            >
                <i class="bi bi-plus-lg me-1"></i>Nova categoria
            </button>
        </div>
    </header>

    <div class="filter-bar filter-bar--compact mb-4" role="search" aria-label="Filtro de categorias">
        <div class="filter-bar__search">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input
                    id="categoria-busca"
                    type="search"
                    name="q"
                    class="form-control border-start-0"
                    value="{{ busca }}"
                    placeholder="Buscar categoria..."
                    autocomplete="off"
                    hx-get="{% url 'lista_categorias' %}"
                    hx-trigger="input changed delay:350ms, search"
                    hx-sync="this:replace"
                    hx-target="#categorias-resultados"
                    hx-push-url="true"
                    hx-disinherit="hx-select"
                    data-sge-loading="inline"
                >
            </div>
        </div>
    </div>

    {% include 'estoque/categorias/_resultados.html' %}
    <div id="modal-categoria-container"></div>
</div>
{% endblock %}
