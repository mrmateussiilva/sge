<div class="modal fade" id="modalFornecedor" tabindex="-1" aria-labelledby="modalFornecedorLabel" aria-hidden="true" data-sge-modal-autoshow>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalFornecedorLabel">
                    <i class="bi bi-truck me-2 text-primary"></i>{% if fornecedor %}Editar fornecedor{% else %}Novo fornecedor{% endif %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <form
                method="post"
                action="{% if fornecedor %}{% url 'editar_fornecedor' fornecedor.id %}{% else %}{% url 'criar_fornecedor' %}{% endif %}"
                hx-post="{% if fornecedor %}{% url 'editar_fornecedor' fornecedor.id %}{% else %}{% url 'criar_fornecedor' %}{% endif %}"
                hx-target="#fornecedores-resultados"
                hx-swap="outerHTML"
                hx-disinherit="hx-select"
            >
                {% csrf_token %}
                <input type="hidden" name="q" value="{{ busca }}">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="fornecedor-nome" class="form-label fw-medium">Nome <span class="text-danger">*</span></label>
                            <input id="fornecedor-nome" type="text" name="nome" class="form-control" value="{{ fornecedor.nome|default:'' }}" placeholder="Nome do fornecedor" maxlength="200" required autofocus>
                        </div>
                        <div class="col-md-4">
                            <label for="fornecedor-cnpj" class="form-label fw-medium">CNPJ</label>
                            <input id="fornecedor-cnpj" type="text" name="cnpj" class="form-control" value="{{ fornecedor.cnpj|default:'' }}" placeholder="00.000.000/0001-00" maxlength="18">
                        </div>
                        <div class="col-md-6">
                            <label for="fornecedor-email" class="form-label fw-medium">E-mail</label>
                            <input id="fornecedor-email" type="email" name="email" class="form-control" value="{{ fornecedor.email|default:'' }}" placeholder="contato@empresa.com">
                        </div>
                        <div class="col-md-6">
                            <label for="fornecedor-telefone" class="form-label fw-medium">Telefone</label>
                            <input id="fornecedor-telefone" type="text" name="telefone" class="form-control" value="{{ fornecedor.telefone|default:'' }}" placeholder="(00) 00000-0000" maxlength="20">
                        </div>
                        <div class="col-12">
                            <label for="fornecedor-observacao" class="form-label fw-medium">Observação</label>
                            <textarea id="fornecedor-observacao" name="observacao" class="form-control" rows="3" placeholder="Informações adicionais...">{{ fornecedor.observacao|default:'' }}</textarea>
                        </div>
                    </div>
                    <div id="fornecedor-form-feedback" class="mt-3">
                        {% include 'estoque/fornecedores/_form_feedback.html' %}
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-lg me-1"></i>Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
