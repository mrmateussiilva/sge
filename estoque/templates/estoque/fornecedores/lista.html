{% extends 'estoque/base.html' %}
{% block title %}S.G.E - Fornecedores{% endblock %}

{% block content %}
<div class="page-container page-container--wide">
    <header class="page-header">
        <div class="page-header__content">
            <div class="page-header__title">
                <span class="page-header__icon"><i class="bi bi-truck"></i></span>
                <h1>Fornecedores</h1>
            </div>
            <p class="page-header__description">Gerencie os fornecedores vinculados aos produtos do estoque.</p>
        </div>
        <div class="page-header__actions">
            <button
                type="button"
                class="btn btn-primary"
                hx-get="{% url 'criar_fornecedor' %}"
                hx-include="#fornecedor-busca"
                hx-target="#modal-fornecedor-container"
                hx-disinherit="hx-select"
            >
                <i class="bi bi-plus-lg me-1"></i>Novo fornecedor
            </button>
        </div>
    </header>

    <div class="filter-bar filter-bar--compact mb-4" role="search" aria-label="Filtro de fornecedores">
        <div class="filter-bar__search">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input
                    id="fornecedor-busca"
                    type="search"
                    name="q"
                    class="form-control border-start-0"
                    value="{{ busca }}"
                    placeholder="Buscar por nome, CNPJ, e-mail ou telefone..."
                    autocomplete="off"
                    hx-get="{% url 'lista_fornecedores' %}"
                    hx-trigger="input changed delay:350ms, search"
                    hx-sync="this:replace"
                    hx-target="#fornecedores-resultados"
                    hx-push-url="true"
                    hx-disinherit="hx-select"
                    data-sge-loading="inline"
                >
            </div>
        </div>
    </div>

    {% include 'estoque/fornecedores/_resultados.html' %}
    <div id="modal-fornecedor-container"></div>
</div>
{% endblock %}
